<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="xLua UI 框架结构">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DBDB6"/>
    </marker>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#173B36" flood-opacity="0.07"/>
    </filter>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #173B36; }
      .sub { font: 400 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
      .layer { font: 700 12px "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; fill: #1F9E8F; }
      .boxTitle { font: 600 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #173B36; }
      .boxSub { font: 400 11.5px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
      .note { font: 400 11.5px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="558" rx="18" fill="#F7FBF9" stroke="#D7ECE7"/>

  <text x="36" y="44" class="title">xLua UI 框架与背包结构</text>
  <text x="36" y="66" class="sub">Object → BasePanel → MainPanel / BagPanel，背包数据驱动 ItemGrid</text>

  <!-- Left: framework -->
  <text x="36" y="106" class="layer">LUA FRAMEWORK</text>
  <line x1="36" y1="116" x2="560" y2="116" stroke="#D7ECE7"/>

  <g filter="url(#soft2)">
    <rect x="36" y="136" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="146" y="164" text-anchor="middle" class="boxTitle">Object</text>
    <text x="146" y="184" text-anchor="middle" class="boxSub">元表 / new / subClass</text>

    <rect x="36" y="232" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="146" y="260" text-anchor="middle" class="boxTitle">BasePanel</text>
    <text x="146" y="280" text-anchor="middle" class="boxSub">加载 / 显示 / 隐藏 / 控件缓存</text>

    <rect x="36" y="340" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="111" y="368" text-anchor="middle" class="boxTitle">MainPanel</text>
    <text x="111" y="388" text-anchor="middle" class="boxSub">打开背包</text>

    <rect x="206" y="340" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="281" y="368" text-anchor="middle" class="boxTitle">BagPanel</text>
    <text x="281" y="388" text-anchor="middle" class="boxSub">3 页签 / 4 列格子</text>

    <rect x="376" y="340" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="461" y="368" text-anchor="middle" class="boxTitle">ItemGrid</text>
    <text x="461" y="388" text-anchor="middle" class="boxSub">图标 / 数量 / 位置</text>
  </g>

  <line x1="146" y1="200" x2="146" y2="224" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="146" y1="296" x2="111" y2="332" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="146" y1="296" x2="281" y2="332" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="356" y1="372" x2="368" y2="372" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- Right: data/resource -->
  <text x="620" y="106" class="layer">DATA &amp; RESOURCE</text>
  <line x1="620" y1="116" x2="864" y2="116" stroke="#D7ECE7"/>

  <g filter="url(#soft2)">
    <rect x="620" y="136" width="244" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="742" y="164" text-anchor="middle" class="boxTitle">ABMgr</text>
    <text x="742" y="184" text-anchor="middle" class="boxSub">AB 包 / 依赖 / 缓存</text>

    <rect x="620" y="232" width="244" height="64" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="742" y="260" text-anchor="middle" class="boxTitle">Prefab / SpriteAtlas / JSON</text>
    <text x="742" y="280" text-anchor="middle" class="boxSub">面板、格子、图标、配置</text>

    <rect x="620" y="340" width="244" height="64" rx="10" fill="#FFFFFF" stroke="#F0D6A6"/>
    <rect x="620" y="340" width="244" height="4" rx="2" fill="#D99A35"/>
    <text x="742" y="368" text-anchor="middle" class="boxTitle">ItemData / PlayerData</text>
    <text x="742" y="388" text-anchor="middle" class="boxSub">id 字典 / 装备·道具·宝石</text>
  </g>

  <line x1="742" y1="200" x2="742" y2="224" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="620" y1="264" x2="560" y2="264" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <line x1="620" y1="372" x2="554" y2="372" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow2)"/>

  <!-- callouts -->
  <rect x="36" y="444" width="510" height="80" rx="10" fill="#FFFFFF" stroke="#D7ECE7"/>
  <text x="54" y="468" class="boxTitle" font-size="13">控件自动绑定</text>
  <text x="54" y="489" class="note">GetComponentsInChildren → 按 txt/img/sV/tog/btn 前缀过滤 →</text>
  <text x="54" y="508" class="note">按名称 + 类型存入字典，新增面板只写业务逻辑</text>

  <rect x="570" y="444" width="294" height="80" rx="10" fill="#FFFFFF" stroke="#D7ECE7"/>
  <text x="588" y="468" class="boxTitle" font-size="13">数据驱动背包</text>
  <text x="588" y="489" class="note">JSON 数组 → id 字典 → ItemGrid 按 id 取图标/数量</text>
  <text x="588" y="508" class="note">切换页签时销毁旧格子，按 4 列重建</text>
</svg>
