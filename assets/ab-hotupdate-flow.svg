<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="AssetBundle 热更新流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DBDB6"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D99A35"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#173B36" flood-opacity="0.07"/>
    </filter>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #173B36; }
      .sub { font: 400 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
      .lane { font: 700 13px "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 1px; }
      .boxTitle { font: 600 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #173B36; }
      .boxSub { font: 400 11.5px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
      .note { font: 400 11.5px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6F7F7B; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="428" rx="18" fill="#F7FBF9" stroke="#D7ECE7"/>

  <text x="40" y="44" class="title">AssetBundle 资源热更新链路</text>
  <text x="40" y="66" class="sub">发布端生成清单并上传，客户端按 MD5 做增量下载</text>

  <!-- Editor lane -->
  <text x="40" y="108" class="lane" fill="#1F9E8F">EDITOR / ABTOOLS</text>
  <line x1="40" y1="118" x2="960" y2="118" stroke="#D7ECE7"/>

  <g filter="url(#soft)">
    <rect x="40" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <rect x="40" y="140" width="200" height="4" rx="2" fill="#1F9E8F"/>
    <text x="140" y="170" text-anchor="middle" class="boxTitle">AB 打包</text>
    <text x="140" y="191" text-anchor="middle" class="boxSub">按平台产出资源包</text>

    <rect x="280" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <rect x="280" y="140" width="200" height="4" rx="2" fill="#1F9E8F"/>
    <text x="380" y="170" text-anchor="middle" class="boxTitle">生成版本清单</text>
    <text x="380" y="191" text-anchor="middle" class="boxSub">文件名 / 大小 / MD5</text>

    <rect x="520" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <rect x="520" y="140" width="200" height="4" rx="2" fill="#1F9E8F"/>
    <text x="620" y="170" text-anchor="middle" class="boxTitle">首包同步</text>
    <text x="620" y="191" text-anchor="middle" class="boxSub">复制到 StreamingAssets</text>

    <rect x="760" y="140" width="200" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <rect x="760" y="140" width="200" height="4" rx="2" fill="#1F9E8F"/>
    <text x="860" y="170" text-anchor="middle" class="boxTitle">FTP 上传</text>
    <text x="860" y="191" text-anchor="middle" class="boxSub">AB 包 + 清单</text>
  </g>

  <line x1="240" y1="174" x2="272" y2="174" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="174" x2="512" y2="174" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="174" x2="752" y2="174" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- FTP to client -->
  <path d="M 860 208 C 860 250, 140 250, 140 276" fill="none" stroke="#D99A35" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowAccent)"/>
  <rect x="420" y="232" width="160" height="26" rx="13" fill="#FFF7E8" stroke="#F0D6A6"/>
  <text x="500" y="249" text-anchor="middle" class="note" fill="#A87527">下载 ABCompare.txt</text>

  <!-- Client lane -->
  <text x="40" y="286" class="lane" fill="#1F9E8F">RUNTIME / ABUPDATEMANAGER</text>
  <line x1="40" y1="296" x2="960" y2="296" stroke="#D7ECE7"/>

  <g filter="url(#soft)">
    <rect x="40" y="318" width="164" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="122" y="348" text-anchor="middle" class="boxTitle">下载远端清单</text>
    <text x="122" y="369" text-anchor="middle" class="boxSub">重试 5 次</text>

    <rect x="224" y="318" width="164" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="306" y="348" text-anchor="middle" class="boxTitle">读取本地清单</text>
    <text x="306" y="369" text-anchor="middle" class="boxSub">首次回退首包</text>

    <rect x="408" y="318" width="164" height="68" rx="10" fill="#FFFFFF" stroke="#F0D6A6"/>
    <rect x="408" y="318" width="164" height="4" rx="2" fill="#D99A35"/>
    <text x="490" y="348" text-anchor="middle" class="boxTitle">MD5 增量对比</text>
    <text x="490" y="369" text-anchor="middle" class="boxSub">新增 / 变更 / 删除</text>

    <rect x="592" y="318" width="164" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="674" y="348" text-anchor="middle" class="boxTitle">下载差异包</text>
    <text x="674" y="369" text-anchor="middle" class="boxSub">Task + FTP</text>

    <rect x="776" y="318" width="184" height="68" rx="10" fill="#FFFFFF" stroke="#CFE8E2"/>
    <text x="868" y="348" text-anchor="middle" class="boxTitle">回写清单 / 清理</text>
    <text x="868" y="369" text-anchor="middle" class="boxSub">进入游戏</text>
  </g>

  <line x1="204" y1="352" x2="216" y2="352" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="388" y1="352" x2="400" y2="352" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="572" y1="352" x2="584" y2="352" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="756" y1="352" x2="768" y2="352" stroke="#9DBDB6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="40" y="414" class="note">清单格式：文件名 大小 MD5 | 文件名 大小 MD5 | …　·　只下载有差异的 AB，避免整包重下</text>
</svg>
